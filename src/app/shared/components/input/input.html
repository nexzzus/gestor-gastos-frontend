<div class="flex flex-col gap-x-1.5">
  @if (label()) {
    <label [for]="inputId()" class="input-label">
      {{ label() }}
      @if (required) {
        <span class="text-red-500 ml-1">*</span>
      } @else {
        <span class="text-slate-400 font-normal text-sm ml-1">(opcional)</span>
      }
    </label>
  }

  <div class="relative">
    <!-- Símbolo de moneda flotante -->
    @if (isCurrency()) {
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
        <span class="text-on-surface-variant/70 font-body-md {{colorSymbol()}}">$</span>
      </div>
    }

    <input
      #nativeInput
      [id]="inputId()"
      [attr.name]="id() ? (id() + '-' + uniqueId) : uniqueId"
      [type]="inputType"
      [value]="value()"
      [placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [disabled]="disabled"
      [required]="required"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="w-full xl:h-11 py-3 bg-surface-variant border-2 border-transparent
             transition-colors rounded-lg font-body-md text-on-surface
             placeholder:text-on-surface-variant/50
             focus:shadow focus:shadow-primary-3
             focus:outline-none focus:ring-0
             focus:border-primary-4 focus:ring-2 focus:ring-primary/20
             disabled:cursor-not-allowed disabled:bg-gray-100 disabled:text-gray-500"

      [class.px-4]="!isCurrency()"
      [class.pl-9]="isCurrency()"
      [class.pr-4]="isCurrency()"
      [class.border-red-500]="hasError"
      [class.focus:border-red-500]="hasError"
      [class.focus:ring-red-200]="hasError"
    />

    @if (type() === 'password') {
      <button
        type="button"
        tabindex="-1"
        [disabled]="disabled"
        (click)="togglePassword()"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400
               hover:text-gray-600 disabled:cursor-not-allowed"
      >
        @if (showPassword) {
          <ng-icon name="solarEyeLinear" size="20" />
        } @else {
          <ng-icon name="solarEyeClosed" size="20" />
        }
      </button>
    }
  </div>

  @if (hasError) {
    <span class="text-xs text-red-500">
      {{ errorMessage }}
    </span>
  }
</div>
