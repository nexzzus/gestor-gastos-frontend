<main class="min-h-screen bg-slate-50 flex flex-col items-center px-5 py-8 overflow-hidden">

  <!-- Etiqueta de error -->
  <span
    class="inline-flex items-center gap-2 rounded-full bg-indigo-100/70 px-3 py-1.5 text-[11px] font-bold tracking-wide text-slate-600">
    <span class="size-2 rounded-full bg-emerald-500"></span>
    ERROR 404 • PÁGINA NO ENCONTRADA
  </span>

  <!-- Ilustración -->
  <div class="relative mt-8 grid place-items-center size-72 sm:size-80" aria-hidden="true">

    <!-- Resplandor de fondo -->
    <div class="absolute inset-[-40px] rounded-full bg-emerald-100/50 blur-3xl"></div>

    <!-- Círculos concéntricos -->
    <div class="absolute inset-0 rounded-full bg-white shadow-xl shadow-emerald-900/5"></div>
    <div class="absolute inset-3 rounded-full bg-emerald-50"></div>
    <div class="absolute inset-12 rounded-full bg-emerald-100/70"></div>

    <!-- Los "4" de fondo -->
    <span class="absolute left-6 top-14 text-8xl font-extrabold text-emerald-900/10 select-none">4</span>
    <span class="absolute right-6 top-14 text-8xl font-extrabold text-emerald-900/10 select-none">4</span>

    <!-- Tarjeta central con signo de pregunta -->
    <div class="relative grid place-items-center size-24 rounded-2xl bg-white shadow-lg ring-1 ring-slate-100">
      <span class="grid place-items-center size-14 rounded-full border-4 border-emerald-500 text-emerald-600">
        <ng-icon name="matHelpOutline" size="28" />
      </span>
    </div>

    <!-- Rectángulo decorativo (arriba izquierda) -->
    <div class="absolute left-0 top-6 h-10 w-14 -rotate-12 rounded-lg bg-indigo-100"></div>

    <!-- Moneda -->
    <div
      class="absolute left-3 bottom-16 grid place-items-center size-9 rounded-full border-2 border-amber-400 bg-amber-100 text-sm font-bold text-amber-600">
      $
    </div>

    <!-- Botón + -->
    <div class="absolute right-2 top-4 grid place-items-center size-9 rounded-full bg-emerald-200 text-emerald-800">
      <ng-icon name="matAddOutline" size="20" />
    </div>

    <!-- Documento inclinado -->
    <div
      class="absolute right-6 bottom-12 flex w-14 rotate-6 flex-col gap-1.5 rounded-lg bg-white p-2.5 shadow-md ring-1 ring-slate-100">
      <span class="h-0.5 w-full rounded bg-slate-300"></span>
      <span class="h-0.5 w-4/5 rounded bg-slate-300"></span>
      <span class="h-0.5 w-full rounded bg-slate-300"></span>
      <span class="h-0.5 w-1/2 rounded bg-emerald-500"></span>
    </div>
  </div>

  <!-- Texto -->
  <h1 class="mt-10 max-w-md text-center text-3xl sm:text-4xl font-extrabold leading-tight text-slate-900">
    ¡Ups! Esta partida no figura en tus balances
  </h1>

  <p class="mt-3 max-w-md text-center text-slate-600 leading-relaxed">
    La dirección que buscas no existe, ha sido movida o la transacción fue reubicada en otro
    periodo contable. Revisa la URL o regresa a un lugar seguro en tu cuenta.
  </p>

  <!-- Acciones -->
  <div class="mt-8 flex flex-wrap justify-center gap-3">
    <button
      (click)="goDashboard()"
      class="inline-flex items-center gap-2 rounded-xl bg-primary-4 px-5 py-3 text-sm font-bold text-[#004731] shadow-md shadow-emerald-500/20 transition-opacity hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600">
      <ng-icon name="matDashboardOutline" size="18" />
      Volver al Dashboard
    </button>

    <button
      (click)="goTransctions()" )
      class="inline-flex items-center gap-2 rounded-xl bg-white px-5 py-3 text-sm font-bold text-blue-700 shadow-sm transition-colors hover:bg-indigo-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
      <ng-icon name="matReceiptLongOutline" size="18" />
      Ir a Transacciones
    </button>
  </div>


</main>
