<div
  class="flex w-full lg:w-[80%] min-h-dvh lg:min-h-0 flex-col items-center bg-white px-2 py-4 sm:px-6 lg:px-8 lg:rounded-2xl lg:shadow-md">
  <!-- ICONO -->
  <div
    class="flex size-11.25 items-center justify-center rounded-full bg-background"
  >
    <!--    <ng-icon name="matAccountBalanceOutline" class="text-4xl text-[#006c49] justify-center items-center"/>-->
    <ng-icon name="matAccountBalanceOutline" size="32" color="#006c49"/>
  </div>

  <!-- TÍTULO -->
  <h1 class="text-xl font-bold text-black">
    FinanzaFlow
  </h1>

  <p class="text-gray-800">
    Tu ruta clara hacia la seguridad financiera.
  </p>

  <div class="flex w-[80%] flex-col">

    @if (apiError()) {
      <span class="w-full bg-red-300 text-sm my-1 text-center border rounded-lg">{{ apiError() }}</span>
    }

    <!-- FORMULARIO -->
    <form
      [formGroup]="loginForm"
      (ngSubmit)="login()"
      class="mt-10 grid grid-cols-1 gap-y-7 xl:gap-y-4"
    >

      <!-- CORREO -->
      <div class="grid grid-cols-1 gap-y-4 xl:gap-y-1">

        <app-input
          id="email"
          type="email"
          label="Correo Electrónico"
          placeholder="tu@correo.com"
          autocomplete="email"
          formControlName="email"
        />

      </div>

      <!-- CONTRASEÑA -->
      <div class="flex flex-col">
          <label
            for="password"
            class="font-medium text-gray-700"
          >
            Contraseña
          </label>

        <app-input
          id="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          formControlName="password"
        />

        <a
          routerLink="/forgot-password"
          class="text-right text-sm text-blue-700 hover:underline whitespace-nowrap mt-2"
        >
          ¿Olvidaste tu contraseña?
        </a>


      </div>

      <!-- BOTÓN LOGIN -->
      <div>
        <app-button
          type="submit"
          text="Iniciar Sesión"
        />
      </div>

    </form>

    <!-- CONTINUAR CON -->
    <div class="mt-5 w-full text-center">

      <span class="text-xs text-gray-500">
        O CONTINUAR CON
      </span>

      <!-- GOOGLE -->
      <div class="mt-5 grid w-full grid-cols-1 gap-y-2">

        <button
          type="button"
          (click)="loginGoogle()"
          class="flex w-full cursor-pointer items-center justify-center
                 gap-3 rounded-xl border-2 border-gray-300
                 bg-transparent py-3 text-gray-700
                 transition-colors duration-200
                 hover:border-secondary hover:text-secondary"
        >

          <!-- GOOGLE ICON -->
          <svg
            class="size-5"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />

            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />

            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            />

            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>

          Google
        </button>

      </div>

      <!-- REGISTRO -->
      <div class="my-5 text-center">

        <p class="text-sm text-gray-700">
          ¿No tienes una cuenta?

          <a
            routerLink="/register"
            class="ml-2 cursor-pointer text-blue-700 hover:underline"
          >
            Regístrate aquí
          </a>
        </p>

      </div>

    </div>

  </div>
</div>
