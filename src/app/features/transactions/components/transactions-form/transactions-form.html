<!--TITULO Y DESCRIPCION-->
<div class="text-center md:text-left">
  <h1 class="text-3xl font-bold">Nuevo Movimiento</h1>
  <p class="text-gray-600">Registra un nuevo ingreso o gasto detallando el monto, la fecha y su categoría.</p></div>

<!--FORMULARIO DE TRANSACCIONES-->
<div>
  <form class="max-w-2xl bg-white p-4 rounded-lg" [formGroup]="transactForm" autocomplete="off">
    <!-- TIPO DE MOVIMIENTO -->
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xs font-bold text-slate-800 tracking-wide">TIPO DE MOVIMIENTO</h1>

      <div class="inline-flex bg-indigo-50 rounded-xl p-1 gap-1">
        <button
          type="button"
          class="flex items-center gap-1.5 px-4 py-2 rounded-lg font-semibold text-sm transition-all duration-300 cursor-pointer"
          [class.bg-gradient-to-br]="type() === 'gasto'"
          [class.from-red-700]="type() === 'gasto'"
          [class.to-red-900]="type() === 'gasto'"
          [class.text-white]="type() === 'gasto'"
          [class.shadow-md]="type() === 'gasto'"
          [class.text-slate-600]="type() !== 'gasto'"
          (click)="selection('gasto')"
        >
          <ng-icon name="matTrendingDownOutline"/>
          Gasto
        </button>

        <button
          type="button"
          class="flex items-center gap-1.5 px-4 py-2 rounded-lg font-semibold text-sm transition-all duration-300 cursor-pointer"
          [class.bg-gradient-to-br]="type() === 'ingreso'"
          [class.from-green-600]="type() === 'ingreso'"
          [class.to-green-800]="type() === 'ingreso'"
          [class.text-white]="type() === 'ingreso'"
          [class.shadow-md]="type() === 'ingreso'"
          [class.text-slate-600]="type() !== 'ingreso'"
          (click)="selection('ingreso')">
          <ng-icon name="matTrendingUpOutline"/>
          Ingreso
        </button>
      </div>
    </div>

    <!-- MONTO DE LA OPERACIÓN -->
    <div class="flex flex-col lg:flex-row lg:justify-between lg:items-start bg-indigo-50 rounded-2xl px-6 py-5">
      <div class="flex w-full min-w-0 flex-col gap-1.5 lg:w-auto">
        <h1 class="text-xs font-bold text-slate-800 tracking-wide">MONTO DE LA OPERACIÓN</h1>
        <div class="flex items-baseline gap-1.5">
          <span class="text-2xl font-bold hidden lg:inline" [ngClass]="colorClase()">{{ symbol() }}</span>
          <app-input
            formControlName="amount"
            type="number"
            step="0.01"
            placeholder="0,00"
            class="min-w-0 flex-1 bg-transparent text-3xl font-bold outline-none lg:w-70 lg:flex-none
               [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
            [ngClass]="colorClase()"
            [isCurrency]="true"
            [colorSymbol]="colorClase()"
          />
        </div>
      </div>

      <div class="flex w-full flex-col gap-2.5 mt-4 lg:mt-0 lg:w-auto lg:items-end">
        <button
          type="button"
          class="hidden lg:flex items-center gap-1.5 bg-white border border-indigo-100 rounded-lg px-3.5 py-2 font-semibold text-sm">
          COP ($)
          <span class="text-xs text-gray-400">⌄</span>
        </button>

        <div class="flex w-full gap-2">
          <button type="button"
                  (click)="summer(10000)"
                  class="flex-1 bg-white border border-indigo-100 rounded-lg cursor-pointer px-3 py-1.5 text-sm font-semibold text-slate-700 hover:bg-indigo-100 transition-colors lg:flex-none">
            +10.000
          </button>
          <button type="button"
                  (click)="summer(50000)"
                  class="flex-1 bg-white border border-indigo-100 rounded-lg cursor-pointer px-3 py-1.5 text-sm font-semibold text-slate-700 hover:bg-indigo-100 transition-colors lg:flex-none">
            +50.000
          </button>
          <button type="button"
                  (click)="summer(100000)"
                  class="flex-1 bg-white border border-indigo-100 rounded-lg cursor-pointer px-3 py-1.5 text-sm font-semibold text-slate-700 hover:bg-indigo-100 transition-colors lg:flex-none">
            +100.000
          </button>
        </div>
      </div>
    </div>

    <!--    DETALLES DEL MOVIMIENTO-->
    <div class="mt-9">
      <h1 class="text-2xl font-medium">Detalles del movimiento</h1>
      <div class="grid grid-cols-2 gap-x-5 mt-8">
        <div class="flex flex-col">
          <label for="category">Categoría</label>
          <select name="category" id="category" formControlName="category" class="">
            @if (type() === 'ingreso') {
              <option value="{{incomeCategoryId()}}" selected>INGRESO</option>
            } @else {
              @for (category of categories(); track category.id) {
                @if (category.name !== 'INGRESO') {
                  <option value="{{category.id}}">
                    {{ category.name }}
                  </option>
                }
              }
            }
          </select>
        </div>
        <div>
          <label for="paymentMethod">Método de pago</label>
          <select name="paymentMethod" id="paymentMethod" formControlName="paymentMethod" class="w-full">
            <option value="EFECTIVO">EFECTIVO</option>
            <option value="TARJETA_CREDITO">TARJETA_CREDITO</option>
            <option value="TARJETA_DEBITO">TARJETA_DEBITO</option>
            <option value="TRANSFERENCIA_BANCARIA">TRANSFERENCIA_BANCARIA</option>
          </select>
        </div>
      </div>
    </div>

    <!-- TITULO DEL MOVIMIENTO -->
    <div class="flex flex-col gap-y-1 mt-4">
      <app-input
        placeholder="Título del movimiento"
        label="Título"
        type="text"
        id="title"
        formControlName="title"
      />
    </div>

    <!--    DESCRIPCIÓN DEL MOVIMIENTO-->
    <div class="flex flex-col gap-y-1 mt-4">
      <app-input
        placeholder="Descripción del movimiento"
        label="Descripción"
        type="text"
        id="description"
        formControlName="description"
      />
    </div>

    <!--    BOTONES DE ENVIAR FORMULARIO-->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-x-5 gap-y-3 mt-6">
      <app-button
        text="Descartar cambios"
        (click)="discardChanges()"
        colorBg=""
        colorText="text-black"
        class="order-3 md:order-1 col-span-2 md:col-span-1"
      />

      <app-button
        (click)="saveAndAddAnother()"
        text="Guardar y agregar otra"
        colorText="text-secondary"
        colorBg="bg-surface-variant"
        class="order-1 md:order-2"
        [disabled]="isSubmitting() || transactForm.invalid"
      />

      <app-button
        text="Guardar Transacción"
        (click)="saveAndGoDahboard()"
        colorBg="bg-primary-3"
        class="order-2 md:order-3"
        [disabled]="isSubmitting() || transactForm.invalid"
      />
    </div>
  </form>
</div>
